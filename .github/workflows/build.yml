name: Build, Test & Package

on:
  pull_request:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run frontend e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Restore backend test dependencies
        run: dotnet restore backend.tests/DBADashWebView.Tests.csproj

      - name: Run backend tests
        run: dotnet test backend.tests/DBADashWebView.Tests.csproj --configuration Release --no-restore

      - name: Publish backend
        if: github.event_name != 'pull_request'
        working-directory: backend
        run: dotnet publish -c Release -o ../publish

      - name: Copy frontend to wwwroot
        if: github.event_name != 'pull_request'
        run: |
          if (Test-Path publish\wwwroot) { Remove-Item -Recurse publish\wwwroot }
          Copy-Item -Recurse frontend\dist publish\wwwroot

      - name: Add web.config
        if: github.event_name != 'pull_request'
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet" arguments=".\DBADashWebView.dll" stdoutLogEnabled="false" hostingModel="InProcess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>
          '@ | Set-Content publish\web.config

      - name: Create ZIP artifact
        if: github.event_name != 'pull_request'
        run: Compress-Archive -Path publish\* -DestinationPath dbadash-webview.zip

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dbadash-webview
          path: dbadash-webview.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dbadash-webview.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
